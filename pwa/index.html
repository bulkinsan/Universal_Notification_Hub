<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a73e8">
  <link rel="manifest" href="/pwa/manifest.json">
  <title>Notification Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: #121212; color: #e0e0e0; min-height: 100vh; }
    .header { background: #1a73e8; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 20px; font-weight: 600; }
    .header .subtitle { font-size: 12px; opacity: .8; }
    .container { max-width: 640px; margin: 0 auto; padding: 16px; }
    .source-card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px;
                   padding: 16px; margin-bottom: 12px;
                   display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .source-card.subscribed { border-color: #1a73e8; }
    .source-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    .source-logo { width: 44px; height: 44px; border-radius: 10px; object-fit: cover;
                   background: #2a2a2a; flex-shrink: 0; }
    .source-name { font-weight: 600; font-size: 15px; }
    .source-domain { font-size: 12px; color: #888; }
    .source-desc { font-size: 13px; color: #aaa; margin-top: 4px; }
    .sub-btn { background: #1a73e8; color: #fff; border: none; border-radius: 8px;
               padding: 8px 20px; font-size: 14px; cursor: pointer; font-weight: 500;
               flex-shrink: 0; transition: background .2s; }
    .sub-btn:hover { background: #1557b0; }
    .sub-btn:disabled { opacity: .5; cursor: not-allowed; }
    .sub-btn[data-action="unsubscribe"] { background: transparent; border: 1px solid #555; color: #ccc; }
    .sub-btn[data-action="unsubscribe"]:hover { background: #333; }
    .user-id { text-align: center; padding: 12px; font-size: 11px; color: #555; word-break: break-all; }
    .error { color: #f44336; text-align: center; padding: 20px; }
    .muted { color: #666; text-align: center; padding: 20px; }
    .loading { text-align: center; padding: 40px; color: #888; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Notification Hub</h1>
      <div class="subtitle">Push notifications from your favorite services</div>
    </div>
  </div>
  <div class="container" id="app">
    <div class="loading">Loading sources...</div>
  </div>
  <div class="user-id" id="userId"></div>

  <script>
    let VAPID_PUBLIC_KEY = '';

    fetch('/api/v1/vapid-public-key')
      .then(r => r.json())
      .then(d => {
        VAPID_PUBLIC_KEY = d.publicKey;
        document.getElementById('userId').textContent = 'User: ' + (localStorage.getItem('hub_user_id') || '...');
        const s = document.createElement('script');
        s.src = '/pwa/app.js';
        document.body.appendChild(s);
      })
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<p class=error>Failed to connect to server. Make sure the backend is running.</p>';
      });
  </script>
</body>
</html>
