name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run migrations check
        working-directory: backend
        run: npm run migrate
        env:
          DB_FILENAME: ./data/hub.sqlite
          VAPID_SUBJECT: mailto:ci@hub.local

      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          ADMIN_PASSWORD: ci-test-password
          JWT_SECRET: ci-test-secret
